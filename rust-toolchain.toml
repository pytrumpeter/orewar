# Bevy 0.19 requires rustc 1.95+. Pinned here rather than changing the machine's
# default toolchain, so this project builds reproducibly without affecting
# anything else installed on the system.
[toolchain]
channel = "1.98.1"
# The Android build needs the standard library for the device's architecture.
# Named here so a fresh checkout gets it without anyone having to remember a
# `rustup target add`.
targets = ["aarch64-linux-android"]
