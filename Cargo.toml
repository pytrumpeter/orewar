[workspace]
resolver = "3"
members = [
    "crates/orewar-shared",
    "crates/orewar-server",
    "crates/orewar-server-gui",
    "crates/orewar-client",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
orewar-shared = { path = "crates/orewar-shared" }

# Bevy is miserable to iterate on unless dependencies are optimized.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
